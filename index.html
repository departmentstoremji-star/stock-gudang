    <!-- JAVASCRIPT LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        window.items = [];
        window.penerimaanList = [];
        window.pemakaianList = [];
        window.mutasiList = [];
        window.db = null;

        // Firebase Configuration Fallback Check
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig) {
            try {
                const app = initializeApp(firebaseConfig);
                window.db = getFirestore(app);
                document.getElementById('db-status-badge').innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Firestore Connected';
            } catch (e) {
                console.warn("Firebase Init Error, fallback to LocalStorage", e);
            }
        }

        // Initialize App Data
        window.onload = function() {
            startClock();
            loadInitialData();
            switchTab('home');
        };

        // Real-time Clock
        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('clock').innerText = now.toLocaleTimeString('id-ID');
                document.getElementById('date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }, 1000);
        }

        // Navigation Tabs
        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            if (tabId === 'laporan') renderLaporanStock();
            if (tabId === 'home') updateDashboardStats();
        }

        // Local Storage Helpers
        function loadInitialData() {
            window.items = JSON.parse(localStorage.getItem('mji_items')) || [
                { id: '1', kode: 'MJI-001', nama: 'Bearing SKF 6204', jenis: 'Sparepart', satuan: 'PCS', stok: 25, foto: '' },
                { id: '2', kode: 'MJI-002', nama: 'Plat Besi 10mm', jenis: 'Raw Material', satuan: 'LEMBAR', stok: 8, foto: '' }
            ];
            window.penerimaanList = JSON.parse(localStorage.getItem('mji_penerimaan')) || [];
            window.pemakaianList = JSON.parse(localStorage.getItem('mji_pemakaian')) || [];
            window.mutasiList = JSON.parse(localStorage.getItem('mji_mutasi')) || [];
            
            saveLocalState();
            updateDashboardStats();
        }

        function saveLocalState() {
            localStorage.setItem('mji_items', JSON.stringify(window.items));
            localStorage.setItem('mji_penerimaan', JSON.stringify(window.penerimaanList));
            localStorage.setItem('mji_pemakaian', JSON.stringify(window.pemakaianList));
            localStorage.setItem('mji_mutasi', JSON.stringify(window.mutasiList));
            updateDashboardStats();
        }

        // Toast Notification System
        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bg = type === 'success' ? 'bg-emerald-600' : 'bg-red-600';
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-xmark';
            
            toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 border border-white/20 transition-all duration-300 transform translate-y-2 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Modal Helpers
        window.openModal = function(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Barcode Generator
        window.generateBarcodePreview = function() {
            const code = document.getElementById('itemKode').value || '123456';
            try {
                JsBarcode("#barcodePreview", code, { format: "CODE128", height: 35, displayValue: false });
            } catch (e) { }
        }

        // Image Base64 Converter
        let base64ImageTemp = '';
        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64ImageTemp = e.target.result;
                    document.getElementById('itemFotoPreview').src = base64ImageTemp;
                };
                reader.readAsDataURL(file);
            }
        }

        // SAVE / EDIT ITEM MASTER
        window.saveItem = async function(e) {
            e.preventDefault();
            const id = document.getElementById('editItemId').value || Date.now().toString();
            const kode = document.getElementById('itemKode').value.trim();
            const nama = document.getElementById('itemNama').value.trim();
            const jenis = document.getElementById('itemJenis').value.trim();
            const satuan = document.getElementById('itemSatuan').value;

            const existingIndex = window.items.findIndex(i => i.id === id);

            const itemData = {
                id,
                kode,
                nama,
                jenis,
                satuan,
                stok: existingIndex >= 0 ? window.items[existingIndex].stok : 0,
                foto: base64ImageTemp || (existingIndex >= 0 ? window.items[existingIndex].foto : '')
            };

            if (existingIndex >= 0) {
                window.items[existingIndex] = itemData;
            } else {
                window.items.push(itemData);
            }

            // Sync with Firestore safely
            if (window.db) {
                try {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app';
                    await addDoc(collection(window.db, 'artifacts', appId, 'public', 'data', 'items'), itemData);
                } catch (err) { console.warn('Firestore fallback activated'); }
            }

            saveLocalState();
            showToast('Data Item Berhasil Disimpan!');
            closeModal('modalInputItem');
            document.getElementById('formInputItem').reset();
            base64ImageTemp = '';
            document.getElementById('itemFotoPreview').src = 'https://placehold.co/100x100/e2e8f0/94a3b8?text=No+Image';
        }

        window.renderDaftarItem = function() {
            const search = (document.getElementById('searchItemInput').value || '').toLowerCase();
            const tbody = document.getElementById('daftarItemTable');
            tbody.innerHTML = '';

            window.items.filter(i => i.kode.toLowerCase().includes(search) || i.nama.toLowerCase().includes(search)).forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 cursor-pointer';
                tr.ondblclick = () => editItem(item.id);
                tr.innerHTML = `
                    <td class="p-3"><img src="${item.foto || 'https://placehold.co/50x50/e2e8f0/94a3b8?text=No+Image'}" class="w-10 h-10 object-cover rounded-lg"></td>
                    <td class="p-3 font-mono font-bold text-blue-600">${item.kode}</td>
                    <td class="p-3 font-medium">${item.nama}</td>
                    <td class="p-3">${item.jenis}</td>
                    <td class="p-3">${item.satuan}</td>
                    <td class="p-3 font-bold">${item.stok}</td>
                    <td class="p-3 text-center">
                        <button onclick="editItem('${item.id}')" class="text-blue-600 hover:text-blue-800 font-semibold text-xs bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-200">
                            <i class="fa-solid fa-pen"></i> Edit
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.editItem = function(id) {
            const item = window.items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('editItemId').value = item.id;
            document.getElementById('itemKode').value = item.kode;
            document.getElementById('itemNama').value = item.nama;
            document.getElementById('itemJenis').value = item.jenis;
            document.getElementById('itemSatuan').value = item.satuan;
            document.getElementById('itemFotoPreview').src = item.foto || 'https://placehold.co/100x100/e2e8f0/94a3b8?text=No+Image';
            document.getElementById('modalItemTitle').innerText = 'Edit Item Master';
            closeModal('modalDaftarItem');
            openModal('modalInputItem');
            generateBarcodePreview();
        }

        // PENERIMAAN / PEMBELIAN BARANG LOGIC
        window.openModalPenerimaan = function() {
            document.getElementById('formPenerimaan').reset();
            document.getElementById('penNo').value = 'RCV-' + Date.now().toString().slice(-6);
            document.getElementById('penTanggal').value = new Date().toISOString().split('T')[0];
            document.getElementById('penerimaanItemsBody').innerHTML = '';
            addTransactionRow('penerimaan');
            openModal('modalInputPenerimaan');
        }

        window.openModalPemakaian = function() {
            document.getElementById('formPemakaian').reset();
            document.getElementById('pemNo').value = 'USE-' + Date.now().toString().slice(-6);
            document.getElementById('pemTanggal').value = new Date().toISOString().split('T')[0];
            document.getElementById('pemakaianItemsBody').innerHTML = '';
            addTransactionRow('pemakaian');
            openModal('modalInputPemakaian');
        }

        window.addTransactionRow = function(type) {
            const tbody = document.getElementById(`${type}ItemsBody`);
            const tr = document.createElement('tr');
            
            let optionsHtml = window.items.map(i => `<option value="${i.id}">${i.kode} - ${i.nama} (Stok: ${i.stok})</option>`).join('');

            tr.innerHTML = `
                <td class="p-2">
                    <select class="item-select w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
                        ${optionsHtml}
                    </select>
                </td>
                <td class="p-2">
                    <input type="number" min="1" value="1" class="item-qty w-full px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
                </td>
                <td class="p-2 text-center">
                    <button type="button" onclick="this.closest('tr').remove()" class="text-red-500 hover:text-red-700 text-sm">&times;</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        window.savePenerimaan = function(e) {
            e.preventDefault();
            const no = document.getElementById('penNo').value;
            const tanggal = document.getElementById('penTanggal').value;
            const supplier = document.getElementById('penSupplier').value;
            const catatan = document.getElementById('penCatatan').value;

            const rows = document.querySelectorAll('#penerimaanItemsBody tr');
            let details = [];

            rows.forEach(row => {
                const itemId = row.querySelector('.item-select').value;
                const qty = parseInt(row.querySelector('.item-qty').value) || 0;
                const item = window.items.find(i => i.id === itemId);

                if (item && qty > 0) {
                    item.stok += qty; // Update Stock (+)
                    details.push({ itemId, kode: item.kode, nama: item.nama, qty });
                    
                    // Record Mutasi
                    window.mutasiList.push({
                        itemId,
                        tanggal,
                        jenis: 'Penerimaan',
                        reff: `${no} (${supplier})`,
                        qty: `+${qty}`
                    });
                }
            });

            window.penerimaanList.push({ no, tanggal, supplier, catatan, details });
            saveLocalState();
            showToast('Penerimaan Barang Berhasil Disimpan & Stok Ditambah!');
            closeModal('modalInputPenerimaan');
        }

        window.savePemakaian = function(e) {
            e.preventDefault();
            const no = document.getElementById('pemNo').value;
            const tanggal = document.getElementById('pemTanggal').value;
            const project = document.getElementById('pemProject').value;
            const catatan = document.getElementById('pemCatatan').value;

            const rows = document.querySelectorAll('#pemakaianItemsBody tr');
            let details = [];

            rows.forEach(row => {
                const itemId = row.querySelector('.item-select').value;
                const qty = parseInt(row.querySelector('.item-qty').value) || 0;
                const item = window.items.find(i => i.id === itemId);

                if (item && qty > 0) {
                    item.stok = Math.max(0, item.stok - qty); // Update Stock (-)
                    details.push({ itemId, kode: item.kode, nama: item.nama, qty });
                    
                    // Record Mutasi
                    window.mutasiList.push({
                        itemId,
                        tanggal,
                        jenis: 'Pemakaian',
                        reff: `${no} (${project})`,
                        qty: `-${qty}`
                    });
                }
            });

            window.pemakaianList.push({ no, tanggal, project, catatan, details });
            saveLocalState();
            showToast('Pemakaian Barang Berhasil Disimpan & Stok Dipotong!');
            closeModal('modalInputPemakaian');
        }

        window.renderDaftarPenerimaan = function() {
            const tbody = document.getElementById('daftarPenerimaanTable');
            tbody.innerHTML = '';
            window.penerimaanList.forEach(p => {
                const tr = document.createElement('tr');
                const itemsStr = p.details.map(d => `${d.nama} (${d.qty})`).join(', ');
                tr.innerHTML = `
                    <td class="p-3 font-mono font-bold text-blue-600">${p.no}</td>
                    <td class="p-3">${p.tanggal}</td>
                    <td class="p-3 font-semibold">${p.supplier}</td>
                    <td class="p-3 text-xs text-slate-600">${itemsStr}</td>
                    <td class="p-3 text-xs italic">${p.catatan || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // LAPORAN STOCK & MUTASI
        window.renderLaporanStock = function() {
            const search = (document.getElementById('searchStockInput')?.value || '').toLowerCase();
            const tbody = document.getElementById('laporanStockTable');
            tbody.innerHTML = '';

            window.items.filter(i => i.kode.toLowerCase().includes(search) || i.nama.toLowerCase().includes(search)).forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 cursor-pointer transition';
                tr.ondblclick = () => openMutasiModal(item.id);

                const statusBadge = item.stok < 10 
                    ? '<span class="px-2.5 py-1 text-xs font-semibold bg-red-100 text-red-700 rounded-full">Stok Kritis</span>'
                    : '<span class="px-2.5 py-1 text-xs font-semibold bg-emerald-100 text-emerald-700 rounded-full">Aman</span>';

                tr.innerHTML = `
                    <td class="p-4"><img src="${item.foto || 'https://placehold.co/50x50/e2e8f0/94a3b8?text=No+Image'}" class="w-10 h-10 object-cover rounded-lg border"></td>
                    <td class="p-4 font-mono font-bold text-blue-600">${item.kode}</td>
                    <td class="p-4 font-semibold text-slate-800">${item.nama}</td>
                    <td class="p-4 text-slate-600">${item.jenis}</td>
                    <td class="p-4 text-slate-600">${item.satuan}</td>
                    <td class="p-4 font-extrabold text-center text-base">${item.stok}</td>
                    <td class="p-4 text-center">${statusBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.openMutasiModal = function(itemId) {
            const item = window.items.find(i => i.id === itemId);
            if (!item) return;

            document.getElementById('mutasiTitle').innerHTML = `<i class="fa-solid fa-clock-rotate-left text-purple-400 mr-2"></i> Mutasi: ${item.nama}`;
            const tbody = document.getElementById('mutasiTableBody');
            tbody.innerHTML = '';

            const list = window.mutasiList.filter(m => m.itemId === itemId);
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-400 text-xs">Belum ada riwayat mutasi.</td></tr>`;
            } else {
                list.forEach(m => {
                    const tr = document.createElement('tr');
                    const isPlus = m.qty.startsWith('+');
                    tr.innerHTML = `
                        <td class="p-3 text-xs">${m.tanggal}</td>
                        <td class="p-3 text-xs font-semibold">${m.jenis}</td>
                        <td class="p-3 text-xs text-slate-600">${m.reff}</td>
                        <td class="p-3 text-xs font-bold text-right ${isPlus ? 'text-emerald-600' : 'text-amber-600'}">${m.qty}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            openModal('modalMutasi');
        }

        // GALERI FOTO LIGHTBOX
        window.openGalleryModal = function() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            const itemsWithFoto = window.items.filter(i => i.foto);
            if (itemsWithFoto.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-8 text-sm">Belum ada foto item yang diupload.</p>`;
            } else {
                itemsWithFoto.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'group relative rounded-xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition cursor-pointer';
                    card.onclick = () => openLightbox(item.foto);
                    card.innerHTML = `
                        <img src="${item.foto}" class="w-full h-36 object-cover group-hover:scale-105 transition duration-300">
                        <div class="p-2 bg-white">
                            <p class="font-bold text-xs truncate">${item.nama}</p>
                            <p class="text-[10px] text-slate-500">${item.kode}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
            openModal('modalGallery');
        }

        window.openLightbox = function(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        window.closeLightbox = function() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        // DASHBOARD STATS
        function updateDashboardStats() {
            document.getElementById('stat-total-item').innerText = window.items.length;
            const totalMasuk = window.mutasiList.filter(m => m.qty.startsWith('+')).reduce((acc, curr) => acc + parseInt(curr.qty.replace('+', '')), 0);
            const totalKeluar = window.mutasiList.filter(m => m.qty.startsWith('-')).reduce((acc, curr) => acc + parseInt(curr.qty.replace('-', '')), 0);
            const kritis = window.items.filter(i => i.stok < 10).length;

            document.getElementById('stat-total-masuk').innerText = totalMasuk;
            document.getElementById('stat-total-keluar').innerText = totalKeluar;
            document.getElementById('stat-stok-kritis').innerText = kritis;
        }
    </script>
</body>
</html>
